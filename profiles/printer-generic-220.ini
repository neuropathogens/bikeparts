# Generic 220 x 220 x 250 mm bed-slinger with a 0.4 mm nozzle and 1.75 mm filament.
# Deliberately conservative so print times are realistic for most printers, not a tuned
# CoreXY. Source: docs/PLAN.md print rules 3 and 6; motion limits are typical
# Marlin defaults for this class of printer (assumption).
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
use_relative_e_distances = 1
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 1000
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 1500
machine_max_acceleration_x = 1000
machine_max_acceleration_y = 1000
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 10
machine_max_jerk_x = 8
machine_max_jerk_y = 8
retract_length = 1
retract_speed = 35
layer_gcode = G92 E0
