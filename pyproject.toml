[project]
name = "bikeparts"
version = "0.0.0"
description = "Open-source, parametric, 3D-printable bicycle accessory parts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0 (code); CERN-OHL-S-2.0 (designs); CC-BY-SA-4.0 (docs)" }
dependencies = [
    "build123d>=0.9",
    "pydantic>=2.7",
    "trimesh>=4.4",
    "numpy>=1.26",
    "rtree>=1.2",
    "lxml>=5.0",
    "networkx>=3.2",
]

[project.scripts]
build = "scripts.build_all:main"
check = "scripts.check_all:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeparts", "checks", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/bikeparts", "checks"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["out", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ×, °, Ø in strings/comments

[tool.pyright]
include = ["src", "checks", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
venvPath = "."
venv = ".venv"
