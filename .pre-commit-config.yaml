# Uses the locked tool versions from uv.lock. Install: `uv run pre-commit install`
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: no-large-meshes
        name: no generated meshes committed (out/ is build output)
        entry: generated STEP/STL/3MF belong in out/ — run `uv run build` instead
        language: fail
        files: \.(stl|3mf|step|stp)$
        exclude: ^test-reports/
